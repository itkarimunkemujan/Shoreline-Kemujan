name: Recalculate shoreline predictions

on:
  schedule:
    - cron: "0 3 1 * *"  # 03:00 UTC on the 1st of each month
  workflow_dispatch: {}

env:
  GEE_PROJECT: gen-lang-client-0412358476
  RUN_DIR: data/interim/run_${{ github.run_id }}

jobs:
  recalculate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest composite (Track A + B input)
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: python -m src.gee.fetch --out-dir "$RUN_DIR"

      - name: Preprocess -- fixed-threshold mask + rolling history
        run: python -m src.preprocessing.mask --in-dir "$RUN_DIR" --state-dir data/state

      - name: Track A -- ConvLSTM inference
        run: python -m src.inference.predict --state-dir data/state --out-dir "$RUN_DIR"

      - name: Postprocess -- Track B transects + combine into GeoJSON/metrics
        run: python -m src.output.geojson --state-dir data/state --pred-dir "$RUN_DIR" --out-dir "$RUN_DIR"

      - name: Push to Sanity
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: python -m src.output.sanity_push --run-dir "$RUN_DIR"

      - name: Commit rolling state + run output back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state "$RUN_DIR"
          git diff --cached --quiet || git commit -m "chore: recalculate shoreline predictions ($(date -u +%Y-%m-%d))"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: shoreline-run-${{ github.run_id }}
          path: ${{ env.RUN_DIR }}
